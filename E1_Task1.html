
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEMS Login</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #263b80;
            color: white;
            padding: 22px 8%;
        }

        main {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 18px #00000012;
        }

        h2 { color: #263b80; text-align: center; }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #263b80;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
        }

        .demo {
            background: #eff6ff;
            padding: 12px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.7;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success { display: block !important; background: #dcfce7; color: #166534; }
        .error { display: block !important; background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
<header>
    <h1>Campus Event Management System</h1>
</header>

<main>
    <h2>User Login</h2>
    <p>Sign in to access your campus account.</p>

    <div class="demo">
        <strong>Demo credentials</strong><br>
        Email: student@example.com<br>
        Password: Student123
    </div>

    <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
</main>

<script>
    const demoEmail = "student@example.com";
    const demoPassword = "Student123";

    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim().toLowerCase();
        const password = document.getElementById("password").value;
        const message = document.getElementById("message");

        if (email === demoEmail && password === demoPassword) {
            message.textContent = "Login successful! Welcome to CEMS.";
            message.className = "success";
        } else {
            message.textContent = "Invalid email or password. Please try again.";
            message.className = "error";
        }
    });
</script>
</body>
</html>
